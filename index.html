<!DOCTYPE html>
<html>
<head>
	<title>new_046</title>
	<meta charset="utf-8">
	<!-- Compiled w/ P5LIVE, http://github.com/ffd8/p5live -->
	<style type="text/css">
		body{
			margin:0;
			overflow:hidden;
		}
		canvas{
			position:fixed;
			top:0;
			left:0;
			z-index:-1;
			width:100vw;
			height:100vh;
			margin:0;
		}
	</style>
	<script type="text/javascript">
		// eco-mode = only render if window focused
		window.onblur = function () {
			noLoop();
		};
		window.onfocus = function () {
			loop();
		};
	</script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
</head>
<body style="background: rgb(200, 200, 200);">

<script type="text/javascript">
//new_046

/* CUSTOM FUNCTIONS FOR P5LIVE */
// keep fullscreen if window resized
function windowResized() {
	resizeCanvas(windowWidth, windowHeight);
}

// custom ease function
function ease(iVal, oVal, eVal){
	return oVal += (iVal - oVal) * eVal;
}

// processing compatibility
function println(msg){
	print(msg);
}


let font;
let particles = [];

// p5 = '2'

async function setup() {
	createCanvas(windowWidth, windowHeight);
	background(200);

	font = await loadFont('includes/demos-data/fonts/RobotoMono-Regular.otf');

	textAlign(CENTER, CENTER);
	textSize(400);

	// Generate contour points ONCE
	let contours = font.textToContours('ELLA', width / 2, height / 2, {
		sampleFactor: 0.25
	});

	// Convert points into particles
	for (const pts of contours) {
		for (const pt of pts) {
			particles.push(new Particle(pt.x, pt.y));
		}
	}
}

function draw() {
	background(200);

	for (let p of particles) {

		let mouse = createVector(mouseX, mouseY);
		let dir = p5.Vector.sub(p.pos, mouse);
		let d = dir.mag();

		if (d < 120) {
			dir.normalize();
			dir.mult(3);
			p.applyForce(dir);
		}

		p.update();
		p.show();
	}
}

class Particle {
	constructor(x, y) {
		this.pos = createVector(x, y);
		this.base = createVector(x, y); // original letter position
		this.vel = p5.Vector.random2D().mult(random(0.5, 2));
		this.acc = createVector(0, 0);
	}

	applyForce(force) {
		this.acc.add(force);
	}

	update() {
		// Attraction back to original shape
		let force = p5.Vector.sub(this.base, this.pos);
		force.mult(0.02);
		this.applyForce(force);

		this.vel.add(this.acc);
		this.pos.add(this.vel);

		this.acc.mult(0);
		this.vel.mult(0.92); // damping
	}

	show() {
		noStroke();
		fill(50);
		circle(this.pos.x, this.pos.y, 2);
	}
}

// Optional: handle resize
function windowResized() {
	resizeCanvas(windowWidth, windowHeight);
}
</script>

</body>
</html>
