<!DOCTYPE html>
<html>
<head>
	<title>adbis_001</title>
	<meta charset="utf-8">
	<!-- Compiled w/ P5LIVE, http://github.com/ffd8/p5live -->
	<style type="text/css">
		body{
			margin:0;
			overflow:hidden;
		}
		canvas{
			position:fixed;
			top:0;
			left:0;
			z-index:-1;
			width:100vw;
			height:100vh;
			margin:0;
		}
	</style>
	<script type="text/javascript">
		// eco-mode = only render if window focused
		window.onblur = function () {
			noLoop();
		};
		window.onfocus = function () {
			loop();
		};
	</script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/processing/p5.js-sound/lib/p5.sound.min.js"></script>
</head>
<body style="background: rgb(0, 0, 0);">

<script type="text/javascript">
//adbis_001

/* CUSTOM FUNCTIONS FOR P5LIVE */
// keep fullscreen if window resized
function windowResized() {
	resizeCanvas(windowWidth, windowHeight);
}

// custom ease function
function ease(iVal, oVal, eVal){
	return oVal += (iVal - oVal) * eVal;
}

// processing compatibility
function println(msg){
	print(msg);
}


function setup() {
	createCanvas(windowWidth, windowHeight, WEBGL);

}

function draw() {
	stroke(255)
	let x=cos(frameCount*0.01)
	let a= color(2, 100, 202)
	let b= color(250, 2, 2)
	lights()
	let col= lerpColor(a,b,x)
	let col_2 = lerpColor(b,a,x)
	let col_3 = lerpColor(a,b,x/2)
	//background(col_3)
	//print(x)
	rotateY(frameCount*sin(x))
	//rect(200,200,200,200)
	fill(col)
	rotate(frameCount*.03)
	rotateX(frameCount*sin(x))
	//scale(frameCount*0.3)
	noStroke()
	sphere(200*x)
	fill(col_2)
	box(windowWidth/2,windowHeight/200)
	//torus(400)


}
</script>

</body>
</html>
